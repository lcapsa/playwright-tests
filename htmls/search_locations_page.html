<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>ARR</title>
  <style>
    html,
    body {
      background: #fafafa;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      justify-content: center;
    }

    #search-form {
      position: absolute;
      top: 5%;
      max-width: 330px;

      padding: 10px;
      border-radius: 10px;
      background: #e9ecef;
    }

    #output-container {
      padding: 10px;
    }

    .form {
      display: flex;
    }

    .form * {
      margin: 3px;
    }

    .form input {
      border: none;
      border-radius: 5px;
      outline: none;
      padding: 0 5px;
      line-height: 1.5;

      width: 300px;
      height: 30px;
    }

    .form button {
      height: 30px;
      border-radius: 5px;
      padding: 5px;
      outline: none;
      line-height: 1;
    }

    ul {
      list-style: none;
      padding-left: 15px;
    }

    li {
      padding: 5px 0px;
    }
  </style>

</head>

<body>
  <!-- //purge no_search_form -->
  <div id="search-form">
    <div class="form">
      <input type="text" id="search-input" placeholder="Search query" />

      <button type="button" id="search-button">Search</button>

    </div>

    <div id="output-container">
      Results:

      <ul id="search-results">
      </ul>

    </div>
    <!-- //endpurge no_search_form -->


    <!-- //purge no_search_form -->
    <script>
      const resultsElement = document.getElementById('search-results');
      const searchInputElement = document.getElementById('search-input');
      const searchButton = document.getElementById('search-button');

      const resultsData = [
        //purge multiple_search_results
        'Isla de Muerta',
        'Tortug',
        'Pelegosta',
        'Isla Cruces',
        'Shipwreck Cove',
        'Sola Fide Beach',
        'Isla del Sol',
        //purge exact_search_result
        'Port Royal',
        //endpurge exact_search_result
        'Black Sand Beach',
        'Isla de Corales',
        'Jade Cove'
        //endpurge multiple_search_results
      ];

      const getResults = query => {
        const regex = new RegExp(`${query.toLowerCase()}`);

        return resultsData.filter(data => regex.test(data.toLowerCase()));
      }

      const addResults = results => {
        results.forEach(result => {
          const resultLiElement = document.createElement('li');
          resultLiElement.textContent = result;

          resultsElement.appendChild(resultLiElement);
        })
      };

      const addFeedbackMessage = (id, message) => {
        const messageElement = document.createElement('div');
        messageElement.textContent = message;
        messageElement.id = id;
        resultsElement.appendChild(messageElement);
      }

      const clearResults = () => {
        while (resultsElement.hasChildNodes()) {
          resultsElement.removeChild(resultsElement.lastChild);
        }
      }

      const getSearchQuery = () => searchInputElement.value;

      const handleSearch = () => {
        clearResults();

        const searchQuery = getSearchQuery();

        //purge empty_query_forbidden
        if (searchQuery === "") {
          addFeedbackMessage("error-empty-query", "Provide some query");
          return;
        }
        //endpurge empty_query_forbidden

        const results = getResults(searchQuery);

        //purge no_results_message
        if (results.length === 0) {
          addFeedbackMessage("error-no-results", "No results");
          return;
        }
        //endpurge no_results_message

        setTimeout(() => {
          addResults(results);
        }, 100);
      }

      searchButton.addEventListener('click', handleSearch);
    </script>
    <!-- //endpurge no_search_form -->
</body>

</html>
